    min_users: 3
    min_queries: 5
    min_days: 5
    max_top_user_share: 0.8
    max_active_days_gap: 2
  window_days: 30
  retention_days: 365
  review:
    sla_hours: 72
    escalate_after_sla: 2
    shelve_after_sla: 7
